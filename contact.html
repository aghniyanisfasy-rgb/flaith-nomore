<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan - Custom Plat Nomor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Pemesanan & Kontak</h1>
    </header>

    <nav>
        <a href="home.html">Home</a>
        <a href="profil.html">Profil</a>
        <a href="product.html">Product</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="container">
        <h2>Form Pemesanan / Tanya-Tanya</h2>
        <form>
            <label for="nama">Nama Pemesan:</label>
            <input type="text" id="nama" placeholder="Masukkan nama kamu">

            <label for="nomor">Nomor Plat yang Dipesan:</label>
            <input type="text" id="nomor" placeholder="Contoh: B 1234 ABC (05.28)">

            <label for="jenis">Jenis Kendaraan / Tipe Plat:</label>
            <input type="text" id="jenis" placeholder="Contoh: Plat Motor Akrilik">

            <label for="catatan">Catatan Tambahan:</label>
            <textarea id="catatan" rows="4" placeholder="Tuliskan detail khusus (misal: baut tanam, warna font, dll)..."></textarea>

            <button type="button">Kirim Pesan</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Custom Plat Nomor. All Rights Reserved.</p>
    </footer>

</body>
</html>
